{% extends "base.html" %}
{% block main %}
    <div class="container form-container mt-5 mb-5 card shadow-lg">
        <div>
            <form method='POST' action="">
                {% csrf_token %}
                <div class="row container mb-5 mt-4">
                    <h4 class="mb-3 fw-bold">Update Item</h4>
                    <div class="row">   
                            <hr>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="item" class="form-label">Update Item</label>
                                <select name="item" id="item" class="form-control">
                                    <option name="item" value="" selected>Select Item</option>
                                    {% for product in products %}
                                        <option value="{{ product.id }}" {% if product.id == item.product.id %}selected{% endif %}>{{ product.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="item_unit_price" class="form-label">Unit Price</label>
                                <input type="number" class="form-control" name="item_unit_price" id="item_unit_price" value="{{ item.unit_price|default:0 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="item_quantity" class="form-label">Quantity</label>
                                <input type="number" class="form-control" name="item_quantity" id="item_quantity" value="{{ item.quantity|default:1 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="rate" class="form-label">Tax Rate</label>
                                <input type="text" class="form-control" name="rate" id="rate" value="{{ item.rate|default:18 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="withholdingTax" class="form-label">Withholding Tax</label>
                                <input type="number" class="form-control" name="withholdingTax" id="withholdingTax" value="{{ item.withholdingTax|default:0 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="extraTax" class="form-label">Extra Tax</label>
                                <input type="number" class="form-control" name="extraTax" id="extraTax" value="{{ item.extraTax|default:0 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="furtherTax" class="form-label">further Tax</label>
                                <input type="number" class="form-control" name="furtherTax" id="furtherTax" value="{{ item.furtherTax|default:0 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="fedPaid" class="form-label">fed Paid</label>
                                <input type="number" class="form-control" name="fedPaid" id="fedPaid" value="{{ item.fedPaid|default:0 }}">
                            </div>
                            <div class="mb-3 col-lg-3 col-md-6 mt-1 col-sm-12">
                                <label for="discount" class="form-label">Discount</label>
                                <input type="number" class="form-control" name="discount" id="discount" value="{{ item.discount|default:0 }}">
                            </div>

                            
                            <div class="col-lg-3 mb-1 mt-4 text-center"><button type="submit" class="btn btn-primary btn-lg">Update Item</button></div>
                    </div>

                </div>
            </form>
        </div>
    </div>
{% endblock main %}
