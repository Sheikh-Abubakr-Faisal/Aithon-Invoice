{% extends "base.html" %}
{% block main %}
    <div class="container form-container mt-5 mb-5 card shadow-lg">
        <div>
            <form method='POST' action="">
                {% csrf_token %}
                <div class="row container mb-5 mt-4">
                    <h1 class="mt-2 mb-3">Purchase</h1>
                    <hr>
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                        {% endif %}

                    <div class="mb-3 col-lg-6 col-md-6 col-sm-12">
                        <label for="invoice_number" class="form-label">Invoice Number</label>
                        <input type="text" class="form-control" id="invoice_number" name="invoice_number" required>
                    </div>
                    <div class="mb-3 col-lg-6 col-md-6 col-sm-12">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" name="date" required>
                    </div>

                    <h2 class="mb-3">Seller Details</h2>
                    <hr>
                    <div class="mb-3 col-lg-4 col-md-4 col-sm-12">
                        <label for="supplier" class="form-label">Supplier</label>
                        <select name="supplier" id="supplier" class="form-control" required>
                            <option value="">Select Supplier</option>
                            {% for client in clients %}
                                <option value="{{ client.id }}"
                                    data-registration="{{ client.registration_type }}"
                                    data-ntn="{{ client.ntn }}"
                                    data-address="{{ client.address }}"
                                    data-province="{{ client.province_name }}">
                                    {{ client.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3 col-lg-4 col-md-4 col-sm-12">
                        <label for="supplier_registration_type" class="form-label">Registration Type</label>
                        <input type="text" class="form-control" id="supplier_registration_type" readonly>
                    </div>
                    <div class="mb-3 col-lg-4 col-md-4 col-sm-12">
                        <label for="supplier_ntn" class="form-label">NTN/CNIC</label>
                        <input type="text" class="form-control" id="supplier_ntn" readonly>
                    </div>
                    
                    <div class="mb-3 col-lg-4 col-md-4 col-sm-12">
                        <label for="province" class="form-label">Province</label>
                        <input type="text" class="form-control" id="province" readonly>
                    </div>
                    <div class="mb-3 col-lg-8 col-md-8 col-sm-12">
                        <label for="supplier_address" class="form-label">Address</label>
                        <textarea class="form-control" id="supplier_address" readonly></textarea>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary">Create Purchase Invoice</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
document.getElementById("supplier").addEventListener("change", function() {
    let selected = this.options[this.selectedIndex];
    document.getElementById("supplier_registration_type").value = selected.getAttribute("data-registration") || "";
    document.getElementById("supplier_ntn").value = selected.getAttribute("data-ntn") || "";
    document.getElementById("supplier_address").value = selected.getAttribute("data-address") || "";
    document.getElementById("province").value = selected.getAttribute("data-province") || "";
});
</script>
{% endblock main %}
